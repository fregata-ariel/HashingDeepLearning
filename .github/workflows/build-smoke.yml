name: Build smoke tests

on:
  push:
    branches:
      - research/lsh-lineage-vendor
  workflow_dispatch:

jobs:
  slide-original:
    name: Original SLIDE / GCC
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        working-directory: third_party/slide-original
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        working-directory: third_party/slide-original
        run: cmake --build build --parallel 2

  slide-optimized:
    name: Optimized SLIDE / ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: generic-gcc
            cmake_args: "-DOPT_IA=ON -DOPT_AVX512=OFF -DOPT_AVX512_BF16=OFF"
            arch_flags: ""
          - variant: avx512-gcc
            cmake_args: "-DOPT_IA=ON -DOPT_AVX512=ON -DOPT_AVX512_BF16=OFF"
            arch_flags: "-mavx512f -mavx512bw -mavx512vl -mavx512dq -mfma"
          - variant: avx512-bf16-gcc
            cmake_args: "-DOPT_IA=ON -DOPT_AVX512=ON -DOPT_AVX512_BF16=ON"
            arch_flags: "-mavx512f -mavx512bw -mavx512vl -mavx512dq -mavx512bf16 -mfma"
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        working-directory: third_party/slide-optimized-avx512
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.cmake_args }}
          -DCMAKE_CXX_FLAGS="${{ matrix.arch_flags }}"
      - name: Build
        working-directory: third_party/slide-optimized-avx512
        run: cmake --build build --parallel 2

  mongoose-python:
    name: MONGOOSE / Python syntax
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Python sources
        working-directory: third_party/mongoose
        run: python -m compileall -q mongoose_slide mongoose_reformer lsh_lib

  mongoose-lsh-extension:
    name: MONGOOSE / Cython LSH extension
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip setuptools wheel "Cython<3" numpy
      - name: Build extension
        working-directory: third_party/mongoose/lsh_lib
        run: python setup.py build_ext --inplace
      - name: Import extension
        working-directory: third_party/mongoose/lsh_lib
        run: python -c "import clsh; print(clsh.__file__)"
