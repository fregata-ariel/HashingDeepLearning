name: MONGOOSE native LSH boundary

on:
  push:
    branches: [research/lsh-lineage-vendor]
    paths:
      - "ports/mongoose/lsh_lib/**"
      - "tests/traceability/test_mongoose_native_lsh.cpp"
      - "tests/traceability/test_mongoose_cython_lsh.py"
      - ".github/workflows/mongoose-native.yml"
  pull_request:
    branches: [research/lsh-lineage-vendor]
    paths:
      - "ports/mongoose/lsh_lib/**"
      - "tests/traceability/test_mongoose_native_lsh.cpp"
      - "tests/traceability/test_mongoose_cython_lsh.py"
      - ".github/workflows/mongoose-native.yml"
  workflow_dispatch:

jobs:
  native-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: CPU and commit information
        run: |
          uname -a
          lscpu || true
          grep -m1 '^flags' /proc/cpuinfo || true
          echo "GITHUB_SHA=$GITHUB_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy cython

      - name: Test C++ set semantics
        working-directory: ports/mongoose/lsh_lib
        run: |
          g++ -std=c++11 -O0 -pthread             ../../../tests/traceability/test_mongoose_native_lsh.cpp LSH.cpp             -I. -o /tmp/test_mongoose_native_lsh
          /tmp/test_mongoose_native_lsh

      - name: Build Cython wrapper and test buffer contracts
        working-directory: ports/mongoose/lsh_lib
        run: |
          python setup.py build_ext --inplace
          PYTHONPATH=. python ../../../tests/traceability/test_mongoose_cython_lsh.py
