name: Optimized SLIDE correctness matrix

on:
  push:
    branches:
      - research/lsh-lineage-vendor
    paths:
      - ".github/workflows/optimized-correctness.yml"
  workflow_dispatch:

jobs:
  compare:
    name: scalar-vs-AVX / sample ${{ matrix.sample }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - name: Inspect CPU features
        id: cpu
        shell: bash
        run: |
          set -euxo pipefail
          grep -m1 '^flags' /proc/cpuinfo || true
          if grep -qw avx512f /proc/cpuinfo; then
            echo "has_avx512=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_avx512=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qw avx512_bf16 /proc/cpuinfo; then
            echo "has_bf16=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_bf16=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare deterministic 128-output scalar/AVX workspaces
        if: steps.cpu.outputs.has_avx512 == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          src = Path("third_party/slide-optimized-avx512")
          root = Path("correctness-matrix")
          if root.exists():
              shutil.rmtree(root)

          for variant in ("scalar", "avx"):
              shutil.copytree(src, root / variant)

          def patch(base: Path):
              # Known historical snapshot compatibility defects: #1, #2, #3.
              p = base / "SLIDE/DataLayerOpt.h"
              s = p.read_text()
              bad = "DataLayerOpt() numRecords_{0}, numFeatures_ {0}, numLabels_ {0} {};"
              good = "DataLayerOpt() : numRecords_(0), numFeatures_(0), numLabels_(0) {}"
              assert bad in s
              p.write_text(s.replace(bad, good))

              p = base / "SLIDE/main.cpp"
              lines = p.read_text().splitlines(keepends=True)
              out = []
              i = 0
              while i < len(lines):
                  if "if (numLayer >= MAX_BUFFER_SIZE)" in lines[i]:
                      assert "numLayer = MAX_BUFFER_SIZE;" in lines[i + 1]
                      i += 3
                      continue
                  if "delete sizesOfLayers;" in lines[i]:
                      i += 1
                      continue
                  out.append(lines[i])
                  i += 1

              # Strict post-training finiteness/update instrumentation.
              inst = []
              before = after = False
              for line in out:
                  inst.append(line)
                  if "Network<T, Tp> *_mynet = new Network<T, Tp>(" in line:
                      inst.extend([
                          "    const int smokeWeightCount = sizesOfLayers[0] * InputDim;\n",
                          "    std::vector<float> smokeInitialWeights(smokeWeightCount);\n",
                          "    for (int sw = 0; sw < smokeWeightCount; ++sw) smokeInitialWeights[sw] = float(_mynet->getLayer(0)->_weights[sw]);\n",
                      ])
                      before = True
                  if line.strip() == "delete _mynet;":
                      inst[-1:] = [
                          "    double smokeWeightDeltaL1 = 0.0;\n",
                          "    double smokeWeightSum = 0.0;\n",
                          "    size_t smokeNonFiniteWeights = 0;\n",
                          "    for (int sw = 0; sw < smokeWeightCount; ++sw) {\n",
                          "        double cur = double(float(_mynet->getLayer(0)->_weights[sw]));\n",
                          "        if (!std::isfinite(cur)) ++smokeNonFiniteWeights;\n",
                          "        double d = cur - double(smokeInitialWeights[sw]);\n",
                          "        smokeWeightDeltaL1 += (d < 0.0 ? -d : d);\n",
                          "        smokeWeightSum += cur;\n",
                          "    }\n",
                          "    cout << \"SMOKE_NONFINITE_WEIGHTS \" << smokeNonFiniteWeights << endl;\n",
                          "    cout << \"SMOKE_WEIGHT_DELTA_L1 \" << smokeWeightDeltaL1 << endl;\n",
                          "    cout << \"SMOKE_WEIGHT_SUM \" << smokeWeightSum << endl;\n",
                          "    if (smokeNonFiniteWeights != 0 || !std::isfinite(smokeWeightDeltaL1) || !(smokeWeightDeltaL1 > 0.0)) return 9;\n",
                          line,
                      ]
                      after = True
              assert before and after
              p.write_text("".join(inst))

              p = base / "SLIDE/srp.cpp"
              s = p.read_text()
              if "#include <cstring>" not in s:
                  p.write_text("#include <cstring>\n" + s)

              p = base / "SLIDE/DataLayerOpt.cpp"
              s = p.read_text()
              for name in ("offsets_", "lengths_", "labelOffsets_", "labelLengths_"):
                  old = f"{name}.reserve(numRecords_);"
                  assert old in s
                  s = s.replace(old, f"{name}.resize(numRecords_);")
              p.write_text(s)

              # Issue #6 diagnostic/fix candidate: explicit zero initialization.
              p = base / "SLIDE/Layer.cpp"
              s = p.read_text()
              if "#include <cstring>" not in s:
                  s = s.replace("#include <x86intrin.h>\n", "#include <x86intrin.h>\n#include <cstring>\n")
              s = s.replace(
                  "_biasGrads = (T *)aligned_alloc(64, sizeof(T) * _noOfNodes);",
                  "_biasGrads = (T *)aligned_alloc(64, sizeof(T) * _noOfNodes);\n"
                  "        memset(_weightGrads, 0, sizeof(T) * _noOfNodes * previousLayerNumOfNodes);\n"
                  "        memset(_biasGrads, 0, sizeof(T) * _noOfNodes);",
              )
              s = s.replace(
                  "_adamAvgVel = (float *)aligned_alloc(64, sizeof(float) * _noOfNodes * previousLayerNumOfNodes);",
                  "_adamAvgVel = (float *)aligned_alloc(64, sizeof(float) * _noOfNodes * previousLayerNumOfNodes);\n"
                  "            memset(_adamAvgMom, 0, sizeof(float) * _noOfNodes * previousLayerNumOfNodes);\n"
                  "            memset(_adamAvgVel, 0, sizeof(float) * _noOfNodes * previousLayerNumOfNodes);",
              )
              s = s.replace(
                  "_adamAvgVelBias = (float *)aligned_alloc(64, sizeof(float) * _noOfNodes);",
                  "_adamAvgVelBias = (float *)aligned_alloc(64, sizeof(float) * _noOfNodes);\n"
                  "            memset(_adamAvgMomBias, 0, sizeof(float) * _noOfNodes);\n"
                  "            memset(_adamAvgVelBias, 0, sizeof(float) * _noOfNodes);",
              )

              # Deterministic parameter initialization for A/B comparison.
              needle = "random_device rd;\n        std::mt19937 re(rd());"
              assert needle in s
              s = s.replace(needle, "std::mt19937 re(123456);")
              p.write_text(s)

              def row(label, shift=0):
                  ids = [(shift + i) % 32 for i in range(4)]
                  vals = [1.0, 0.5, 0.25, 0.125]
                  return str(label) + " " + " ".join(f"{i}:{v}" for i, v in zip(ids, vals))

              (base / "smoke_train.txt").write_text(
                  "\n".join(["2 32 128", row(0, 0), row(1, 4)]) + "\n"
              )
              (base / "smoke_test.txt").write_text(
                  "\n".join(["40 32 128"] + [row(i % 4, (i * 3) % 32) for i in range(40)]) + "\n"
              )

              common = [
                  "RangePow=6",
                  "K=2",
                  "L=2",
                  "Sparsity=1,1",
                  "Batchsize=2",
                  "Rehash=1000",
                  "Rebuild=1000",
                  "InputDim=32",
                  "totRecords=2",
                  "totRecordsTest=40",
                  "Lr=0.001",
                  "Epoch=1",
                  "Stepsize=1000",
                  "sizesOfLayers=128",
                  "numLayer=1",
                  "trainData=smoke_train.txt",
                  "testData=smoke_test.txt",
                  "weight=unused.npz",
                  "savedweight=smoke_weights.npz",
                  "logFile=smoke_log.txt",
              ]
              for mode in (0, 1, 2):
                  lines = common + [f"Bfloat16Opt={mode}"]
                  text = "\n".join(lines) + "\n"
                  assert all(line.strip() for line in text.splitlines())
                  (base / f"smoke_mode{mode}.cfg").write_text(text)

          patch(root / "scalar")
          patch(root / "avx")
          PY

      - name: Build and compare scalar FP32 vs AVX-512 FP32
        if: steps.cpu.outputs.has_avx512 == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            intel/oneapi-hpckit:2023.2-devel-ubuntu22.04 \
            bash -lc '
              set -euxo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake make
              source /opt/intel/oneapi/setvars.sh || true

              cd /repo/correctness-matrix/scalar
              cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=icc \
                -DCMAKE_CXX_COMPILER=icpc \
                -DOPT_IA=ON -DOPT_AVX512=OFF -DOPT_AVX512_BF16=OFF
              cmake --build build --parallel 2
              OMP_NUM_THREADS=2 timeout 90s ./build/runme smoke_mode0.cfg 2>&1 | tee scalar_mode0.log
              grep -q "SMOKE_NONFINITE_WEIGHTS 0" scalar_mode0.log
              cp smoke_weights.npz /repo/scalar_weights.npz

              cd /repo/correctness-matrix/avx
              cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=icc \
                -DCMAKE_CXX_COMPILER=icpc \
                -DOPT_IA=ON -DOPT_AVX512=ON -DOPT_AVX512_BF16=OFF
              cmake --build build --parallel 2
              OMP_NUM_THREADS=2 timeout 90s ./build/runme smoke_mode0.cfg 2>&1 | tee avx_mode0.log
              grep -q "SMOKE_NONFINITE_WEIGHTS 0" avx_mode0.log
              cp smoke_weights.npz /repo/avx_weights.npz
            '

      - name: Compare saved FP32 weights numerically
        if: steps.cpu.outputs.has_avx512 == 'true'
        shell: bash
        run: |
          python3 -m pip install -q numpy
          python3 - <<'PY'
          import numpy as np

          s = np.load("scalar_weights.npz")["w_layer_0"].astype(np.float64)
          a = np.load("avx_weights.npz")["w_layer_0"].astype(np.float64)
          assert np.isfinite(s).all()
          assert np.isfinite(a).all()
          diff = np.abs(s - a)
          print("SCALAR_AVX_MAX_ABS_DIFF", float(diff.max()))
          print("SCALAR_AVX_MEAN_ABS_DIFF", float(diff.mean()))
          print("SCALAR_AVX_L1_DIFF", float(diff.sum()))
          # The vector path is intended to be computation-equivalent. Keep the
          # first smoke tolerance loose enough for operation-order differences,
          # but tight enough to catch wrong lanes / skipped blocks.
          assert float(diff.max()) < 1e-4
          print("SCALAR_AVX_FP32_NUMERICAL_COMPARISON_PASS")
          PY

      - name: Run AVX-512 BF16 modes when hardware supports AVX512_BF16
        if: steps.cpu.outputs.has_avx512 == 'true' && steps.cpu.outputs.has_bf16 == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo/correctness-matrix/avx \
            intel/oneapi-hpckit:2023.2-devel-ubuntu22.04 \
            bash -lc '
              set -euxo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake make
              source /opt/intel/oneapi/setvars.sh || true
              rm -rf build-bf16
              cmake -S . -B build-bf16 \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=icc \
                -DCMAKE_CXX_COMPILER=icpc \
                -DOPT_IA=ON -DOPT_AVX512=ON -DOPT_AVX512_BF16=ON
              cmake --build build-bf16 --parallel 2
              for mode in 1 2; do
                rm -f smoke_weights.npz smoke_log.txt
                OMP_NUM_THREADS=2 timeout 90s ./build-bf16/runme "smoke_mode${mode}.cfg" 2>&1 | tee "bf16_mode${mode}.log"
                grep -q "SMOKE_NONFINITE_WEIGHTS 0" "bf16_mode${mode}.log"
                grep -q "SMOKE_WEIGHT_DELTA_L1" "bf16_mode${mode}.log"
                echo "BF16_MODE_${mode}_FINITE_TRAINING_PASS"
              done
            '
