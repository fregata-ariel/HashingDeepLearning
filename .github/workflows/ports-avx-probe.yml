name: Maintained-port AVX tail probe

on:
  push:
    branches:
      - research/lsh-lineage-vendor
    paths:
      - ".github/workflows/ports-avx-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    name: port AVX tail / sample ${{ matrix.sample }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - name: Inspect host CPU before pulling Intel image
        id: cpu
        shell: bash
        run: |
          set -euxo pipefail
          grep -m1 '^flags' /proc/cpuinfo || true
          if grep -qw avx512f /proc/cpuinfo; then
            echo "avx=true" >> "$GITHUB_OUTPUT"
            echo "AVX512F_HOST_FOUND"
          else
            echo "avx=false" >> "$GITHUB_OUTPUT"
            echo "AVX512F_NOT_EXPOSED"
          fi
          if grep -qw avx512_bf16 /proc/cpuinfo; then
            echo "bf16=true" >> "$GITHUB_OUTPUT"
          else
            echo "bf16=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate 4-output tail fixture
        if: steps.cpu.outputs.avx == 'true'
        working-directory: ports/slide-optimized-avx512
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def row(label, shift):
              ids=[(shift+i)%32 for i in range(4)]
              vals=[1.0,0.5,0.25,0.125]
              return str(label)+" "+" ".join(f"{i}:{v}" for i,v in zip(ids,vals))
          Path("smoke_train.txt").write_text("\n".join(["2 32 4",row(0,0),row(1,4)])+"\n")
          Path("smoke_test.txt").write_text("\n".join(["40 32 4"]+[row(i%4,(i*3)%32) for i in range(40)])+"\n")
          common=[
            "RangePow=6","K=2","L=2","Sparsity=1,1","Batchsize=2",
            "Rehash=1000","Rebuild=1000","InputDim=32","totRecords=2",
            "totRecordsTest=40","Lr=0.001","Epoch=1","Stepsize=1000",
            "sizesOfLayers=4","numLayer=1","trainData=smoke_train.txt",
            "testData=smoke_test.txt","weight=unused.npz",
            "savedweight=smoke_weights.npz","logFile=smoke_log.txt"
          ]
          for mode in (0,1,2):
              Path(f"smoke_mode{mode}.cfg").write_text("\n".join(common+[f"Bfloat16Opt={mode}"])+"\n")
          PY

      - name: Build and run maintained AVX/BF16 port
        if: steps.cpu.outputs.avx == 'true'
        working-directory: ports/slide-optimized-avx512
        shell: bash
        run: |
          set -euxo pipefail
          host_bf16="${{ steps.cpu.outputs.bf16 }}"
          docker run --rm \
            -e HOST_BF16="$host_bf16" \
            -v "$PWD:/work" \
            -w /work \
            intel/oneapi-hpckit:2023.2-devel-ubuntu22.04 \
            bash -lc '
              set -euxo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake make
              source /opt/intel/oneapi/setvars.sh || true

              cmake -S . -B build-avx \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=icc -DCMAKE_CXX_COMPILER=icpc \
                -DOPT_IA=ON -DOPT_AVX512=ON -DOPT_AVX512_BF16=OFF
              cmake --build build-avx --parallel 2
              rm -f smoke_weights.npz smoke_log.txt
              OMP_NUM_THREADS=2 timeout 90s ./build-avx/runme smoke_mode0.cfg 2>&1 | tee avx-tail.log
              test -s smoke_weights.npz
              ! grep -Eqi "(^|[^[:alpha:]])nan([^[:alpha:]]|$)" avx-tail.log
              grep -q "save for layer 0" avx-tail.log
              echo "PORT_AVX_FP32_4_OUTPUT_TAIL_PASS"

              if [ "$HOST_BF16" = "true" ]; then
                cmake -S . -B build-bf16 \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_C_COMPILER=icc -DCMAKE_CXX_COMPILER=icpc \
                  -DOPT_IA=ON -DOPT_AVX512=ON -DOPT_AVX512_BF16=ON
                cmake --build build-bf16 --parallel 2
                for mode in 1 2; do
                  rm -f smoke_weights.npz smoke_log.txt
                  OMP_NUM_THREADS=2 timeout 90s ./build-bf16/runme "smoke_mode${mode}.cfg" 2>&1 | tee "bf16-tail-${mode}.log"
                  test -s smoke_weights.npz
                  ! grep -Eqi "(^|[^[:alpha:]])nan([^[:alpha:]]|$)" "bf16-tail-${mode}.log"
                  echo "PORT_BF16_MODE_${mode}_4_OUTPUT_TAIL_PASS"
                done
              fi
            '
