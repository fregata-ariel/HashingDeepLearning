name: Strict Python typing

on:
  push:
    branches: [research/lsh-lineage-vendor]
    paths:
      - "mypy.ini"
      - "ports/mongoose/mongoose_reformer/reformer_lib/scheduler.py"
      - "ports/mongoose/mongoose_reformer/reformer_lib/reformer_pytorch.py"
      - "ports/mongoose/mongoose_reformer/reformer_lib/reversible.py"
      - "ports/mongoose/mongoose_reformer/reformer_lib/autopadder.py"
      - "ports/mongoose/mongoose_reformer/reformer_lib/recorder.py"
      - "ports/mongoose/mongoose_reformer/reformer_lib/generative_tools.py"
      - "ports/mongoose/mongoose_reformer/reformer_lib/reformer_enc_dec.py"
      - "ports/mongoose/mongoose_reformer/train_reformer.py"
      - "typings/**"
      - "tools/check_reformer_attention_types.py"
      - "ports/mongoose/mongoose_slide/slide_lib/simHash.py"
      - "ports/mongoose/mongoose_slide/slide_lib/triplet_network.py"
      - "ports/mongoose/mongoose_slide/slide_lib/lsh.py"
      - "ports/mongoose/mongoose_slide/slide_lib/lsh_softmax.py"
      - "ports/mongoose/mongoose_slide/slide_lib/network.py"
      - "ports/mongoose/mongoose_slide/slide_lib/adam_base.py"
      - "ports/mongoose/mongoose_slide/slide_lib/lazy_parser.py"
      - "ports/mongoose/mongoose_slide/slide_lib/cupy_kernel.py"
      - "ports/mongoose/mongoose_slide/slide_lib/cupy_kernel.pyi"
      - "ports/mongoose/lsh_lib/clsh.pyi"
      - ".github/workflows/python-typing.yml"
  workflow_dispatch:

jobs:
  strict-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install type-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy numpy torch tensorboard

      - name: Run strict mypy on verified contracts
        env:
          MYPYPATH: ${{ github.workspace }}/ports/mongoose:${{ github.workspace }}/typings
        run: |
          python -m mypy --config-file mypy.ini \
            ports/mongoose/mongoose_reformer/reformer_lib/scheduler.py \
            ports/mongoose/mongoose_slide/slide_lib/simHash.py \
            ports/mongoose/mongoose_slide/slide_lib/triplet_network.py \
            ports/mongoose/mongoose_slide/slide_lib/lsh.py \
            ports/mongoose/mongoose_slide/slide_lib/lsh_softmax.py \
            ports/mongoose/mongoose_slide/slide_lib/network.py \
            ports/mongoose/mongoose_slide/slide_lib/adam_base.py \
            ports/mongoose/mongoose_slide/slide_lib/lazy_parser.py \
            ports/mongoose/mongoose_slide/slide_lib/cupy_kernel.py \
            ports/mongoose/mongoose_slide/slide_lib/cupy_kernel.pyi \
            ports/mongoose/lsh_lib/clsh.pyi

      - name: Audit and strict-check Reformer attention core
        env:
          MYPYPATH: ${{ github.workspace }}/ports/mongoose:${{ github.workspace }}/typings
        run: |
          python tools/check_reformer_attention_types.py \
            --output /tmp/reformer_attention_core.py
          python -m mypy --config-file mypy.ini \
            /tmp/reformer_attention_core.py

      - name: Strict-check Reformer wrappers and training entrypoint
        env:
          MYPYPATH: ${{ github.workspace }}/ports/mongoose:${{ github.workspace }}/typings
        run: |
          python -m mypy --config-file mypy.ini \
            ports/mongoose/mongoose_reformer/reformer_lib/reformer_pytorch.py \
            ports/mongoose/mongoose_reformer/reformer_lib/reversible.py \
            ports/mongoose/mongoose_reformer/reformer_lib/autopadder.py \
            ports/mongoose/mongoose_reformer/reformer_lib/recorder.py \
            ports/mongoose/mongoose_reformer/reformer_lib/generative_tools.py \
            ports/mongoose/mongoose_reformer/reformer_lib/reformer_enc_dec.py \
            ports/mongoose/mongoose_reformer/train_reformer.py
