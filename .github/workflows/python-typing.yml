name: Strict Python typing

on:
  push:
    branches: [research/lsh-lineage-vendor]
    paths:
      - "mypy.ini"
      - "ports/**/*.py"
      - "ports/**/*.pyi"
      - "typings/**"
      - "papers/traceability.json"
      - "tools/audit_python_annotations.py"
      - "tools/maintained_python_inventory.json"
      - "tests/traceability/test_python_typing_inventory.py"
      - "docs/MAGICPIG*.md"
      - "docs/SCATTERBRAIN*.md"
      - "tools/check_reformer_attention_types.py"
      - "tools/validate_traceability.py"
      - "tools/audit_traceability_docs.py"
      - "tests/traceability/test_slide_python_examples.py"
      - ".github/workflows/python-typing.yml"
  pull_request:
    branches: [research/lsh-lineage-vendor]
    paths:
      - "mypy.ini"
      - "ports/**/*.py"
      - "ports/**/*.pyi"
      - "typings/**"
      - "papers/traceability.json"
      - "tools/audit_python_annotations.py"
      - "tools/maintained_python_inventory.json"
      - "tests/traceability/test_python_typing_inventory.py"
      - "docs/MAGICPIG*.md"
      - "docs/SCATTERBRAIN*.md"
      - "tools/check_reformer_attention_types.py"
      - "tools/validate_traceability.py"
      - "tools/audit_traceability_docs.py"
      - "tests/traceability/test_slide_python_examples.py"
      - ".github/workflows/python-typing.yml"
  workflow_dispatch:

jobs:
  strict-all-ports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record the exact tested checkout
        run: |
          echo "::notice title=Tested merge candidate::commit=$(git rev-parse HEAD);tree=$(git rev-parse 'HEAD^{tree}')"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install type-check dependencies
        run: |
          python -m pip install mypy==2.4.0 numpy==2.3.5 tensorboard==2.21.0 einops==0.8.1
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip check

      - name: Verify typing inventory and CI enrollment contracts
        run: |
          python tests/traceability/test_python_typing_inventory.py

      - name: Audit annotations and strict-check every maintained Python group
        run: |
          python tools/audit_python_annotations.py --root ports --mypy

      - name: Audit Reformer attention section
        env:
          MYPYPATH: ${{ github.workspace }}/ports/mongoose:${{ github.workspace }}/typings
        run: |
          python tools/check_reformer_attention_types.py \
            --output /tmp/reformer_attention_core.py
          python -m mypy --config-file mypy.ini \
            /tmp/reformer_attention_core.py

      - name: Run SLIDE Python example contract checks
        run: |
          python tests/traceability/test_slide_python_examples.py

      - name: Validate traceability and native documentation
        run: |
          python tools/validate_traceability.py \
            --emit-dir /tmp/final-traceability
          python tools/audit_traceability_docs.py
