name: Strict Python typing

on:
  push:
    branches: [research/lsh-lineage-vendor]
    paths:
      - "mypy.ini"
      - "ports/**/*.py"
      - "ports/mongoose/lsh_lib/clsh.pyi"
      - "typings/**"
      - "papers/traceability.json"
      - "tools/audit_python_annotations.py"
      - "tools/check_reformer_attention_types.py"
      - "tools/validate_traceability.py"
      - "tools/audit_traceability_docs.py"
      - "tests/traceability/test_slide_python_examples.py"
      - ".github/workflows/python-typing.yml"
  pull_request:
    branches: [research/lsh-lineage-vendor]
    paths:
      - "mypy.ini"
      - "ports/**/*.py"
      - "ports/mongoose/lsh_lib/clsh.pyi"
      - "typings/**"
      - "papers/traceability.json"
      - "tools/audit_python_annotations.py"
      - "tools/check_reformer_attention_types.py"
      - "tools/validate_traceability.py"
      - "tools/audit_traceability_docs.py"
      - "tests/traceability/test_slide_python_examples.py"
      - ".github/workflows/python-typing.yml"
  workflow_dispatch:

jobs:
  strict-all-ports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install type-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy numpy torch tensorboard

      - name: Audit all maintained Python annotations
        run: |
          python tools/audit_python_annotations.py \
            --root ports \
            --expected-files 31

      - name: Strict-check all MONGOOSE Python sources
        env:
          MYPYPATH: ${{ github.workspace }}/ports/mongoose:${{ github.workspace }}/typings
        shell: bash
        run: |
          mapfile -t sources < <(find ports/mongoose -type f -name '*.py' -print | sort)
          echo "MONGOOSE_PYTHON_FILES=${#sources[@]}"
          test "${#sources[@]}" -eq 23
          python -m mypy --config-file mypy.ini \
            "${sources[@]}" \
            ports/mongoose/lsh_lib/clsh.pyi

      - name: Audit Reformer attention section
        env:
          MYPYPATH: ${{ github.workspace }}/ports/mongoose:${{ github.workspace }}/typings
        run: |
          python tools/check_reformer_attention_types.py \
            --output /tmp/reformer_attention_core.py
          python -m mypy --config-file mypy.ini \
            /tmp/reformer_attention_core.py

      - name: Strict-check Original SLIDE Python examples
        shell: bash
        run: |
          mapfile -t sources < <(find ports/slide-original/python_examples -type f -name '*.py' -print | sort)
          echo "ORIGINAL_SLIDE_PYTHON_FILES=${#sources[@]}"
          test "${#sources[@]}" -eq 4
          MYPYPATH="${{ github.workspace }}/ports/slide-original/python_examples:${{ github.workspace }}/typings" \
            python -m mypy --config-file mypy.ini "${sources[@]}"

      - name: Strict-check Optimized SLIDE Python examples
        shell: bash
        run: |
          mapfile -t sources < <(find ports/slide-optimized-avx512/python_examples -type f -name '*.py' -print | sort)
          echo "OPTIMIZED_SLIDE_PYTHON_FILES=${#sources[@]}"
          test "${#sources[@]}" -eq 4
          MYPYPATH="${{ github.workspace }}/ports/slide-optimized-avx512/python_examples:${{ github.workspace }}/typings" \
            python -m mypy --config-file mypy.ini "${sources[@]}"

      - name: Run SLIDE Python example contract checks
        run: |
          python tests/traceability/test_slide_python_examples.py

      - name: Validate traceability and native documentation
        run: |
          python tools/validate_traceability.py \
            --emit-dir /tmp/final-traceability
          python tools/audit_traceability_docs.py
