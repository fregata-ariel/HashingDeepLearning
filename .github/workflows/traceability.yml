name: Paper-code traceability

on:
  push:
    branches: [research/lsh-lineage-vendor]
    paths:
      - "papers/**"
      - "docs/MAGICPIG*.md"
      - "docs/SCATTERBRAIN*.md"
      - "tools/validate_traceability.py"
      - "tools/audit_traceability_docs.py"
      - "tools/check_gslide_cpu.py"
      - "tools/check_gslide_sycl.py"
      - "tools/check_gslide_source_regressions.py"
      - "tools/check_gslide_train_adapter.py"
      - "tools/run_sycl_paper_cpu.sh"
      - "tests/gslide_sycl/**"
      - "ports/mongoose/sycl/**"
      - "ports/mongoose/mongoose_slide/slide_lib/simHash.py"
      - "ports/mongoose/lsh_lib/*.h"
      - "tools/check_sycl_cpu.sh"
      - "tools/bootstrap_sycl_cpu.sh"
      - "tools/sycl-cpu-packages.tsv"
      - "ports/sycl-common/**"
      - "tests/sycl_cpu_backend/**"
      - "docs/SYCL_CPU_BACKEND.md"
      - "docs/CI_ARCHITECTURE.md"
      - "tools/check_magicpig_sources.py"
      - "tools/check_scatterbrain_sources.py"
      - "tools/check_scatterbrain_initial_cpu.py"
      - "tools/check_scatterbrain_later_cpu.py"
      - "tools/check_scatterbrain_sbsmyrf_cpu.py"
      - "tools/check_scatterbrain_sbsmyrf_sources.py"
      - "tools/scatterbrain-cpu-requirements.txt"
      - "tools/check_magicpig_cpu.py"
      - "tools/check_magicpig_extension_cpu.py"
      - "tools/check_magicpig_server_cpu.py"
      - "tools/report_magicpig_cpu.py"
      - "tools/generate_magicpig_probability_reference.py"
      - "tools/audit_python_annotations.py"
      - "tools/maintained_python_inventory.json"
      - "third_party/magicpig/**"
      - "third_party/scatterbrain/**"
      - "third_party/scatterbrain-fast-transformers/**"
      - "third_party/scatterbrain-sbsmyrf/**"
      - "ports/scatterbrain/**"
      - "ports/scatterbrain-later/**"
      - "ports/magicpig/**"
      - "third_party/g-slide/**"
      - "ports/g-slide/**"
      - "SOURCE_MANIFEST.tsv"
      - "tests/traceability/**"
      - "ports/slide-original/SLIDE/LSH.*"
      - "ports/slide-original/SLIDE/Bucket.*"
      - "ports/slide-original/SLIDE/*.cpp"
      - "ports/slide-original/SLIDE/*.h"
      - "ports/slide-optimized-avx512/SLIDE/*.cpp"
      - "ports/slide-optimized-avx512/SLIDE/*.h"
      - "ports/mongoose/lsh_lib/LSH.*"
      - "ports/mongoose/lsh_lib/clsh.pyx"
      - "ports/mongoose/lsh_lib/clsh.pyi"
      - "ports/mongoose/mongoose_reformer/reformer_lib/scheduler.py"
      - ".github/workflows/traceability.yml"
      - ".github/workflows/python-typing.yml"
  pull_request:
    branches: [research/lsh-lineage-vendor]
    paths:
      - "papers/**"
      - "docs/MAGICPIG*.md"
      - "docs/SCATTERBRAIN*.md"
      - "tools/validate_traceability.py"
      - "tools/audit_traceability_docs.py"
      - "tools/check_gslide_cpu.py"
      - "tools/check_gslide_sycl.py"
      - "tools/check_gslide_source_regressions.py"
      - "tools/check_gslide_train_adapter.py"
      - "tools/run_sycl_paper_cpu.sh"
      - "tests/gslide_sycl/**"
      - "ports/mongoose/sycl/**"
      - "ports/mongoose/mongoose_slide/slide_lib/simHash.py"
      - "ports/mongoose/lsh_lib/*.h"
      - "tools/check_sycl_cpu.sh"
      - "tools/bootstrap_sycl_cpu.sh"
      - "tools/sycl-cpu-packages.tsv"
      - "ports/sycl-common/**"
      - "tests/sycl_cpu_backend/**"
      - "docs/SYCL_CPU_BACKEND.md"
      - "docs/CI_ARCHITECTURE.md"
      - "tools/check_magicpig_sources.py"
      - "tools/check_scatterbrain_sources.py"
      - "tools/check_scatterbrain_initial_cpu.py"
      - "tools/check_scatterbrain_later_cpu.py"
      - "tools/check_scatterbrain_sbsmyrf_cpu.py"
      - "tools/check_scatterbrain_sbsmyrf_sources.py"
      - "tools/scatterbrain-cpu-requirements.txt"
      - "tools/check_magicpig_cpu.py"
      - "tools/check_magicpig_extension_cpu.py"
      - "tools/check_magicpig_server_cpu.py"
      - "tools/report_magicpig_cpu.py"
      - "tools/generate_magicpig_probability_reference.py"
      - "tools/audit_python_annotations.py"
      - "tools/maintained_python_inventory.json"
      - "third_party/magicpig/**"
      - "third_party/scatterbrain/**"
      - "third_party/scatterbrain-fast-transformers/**"
      - "third_party/scatterbrain-sbsmyrf/**"
      - "ports/scatterbrain/**"
      - "ports/scatterbrain-later/**"
      - "ports/magicpig/**"
      - "third_party/g-slide/**"
      - "ports/g-slide/**"
      - "SOURCE_MANIFEST.tsv"
      - "tests/traceability/**"
      - "ports/slide-original/SLIDE/LSH.*"
      - "ports/slide-original/SLIDE/Bucket.*"
      - "ports/slide-original/SLIDE/*.cpp"
      - "ports/slide-original/SLIDE/*.h"
      - "ports/slide-optimized-avx512/SLIDE/*.cpp"
      - "ports/slide-optimized-avx512/SLIDE/*.h"
      - "ports/mongoose/lsh_lib/LSH.*"
      - "ports/mongoose/lsh_lib/clsh.pyx"
      - "ports/mongoose/lsh_lib/clsh.pyi"
      - "ports/mongoose/mongoose_reformer/reformer_lib/scheduler.py"
      - ".github/workflows/traceability.yml"
      - ".github/workflows/python-typing.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@v4
      - name: Record the exact tested checkout
        run: |
          echo "::notice title=Tested merge candidate::commit=$(git rev-parse HEAD);tree=$(git rev-parse 'HEAD^{tree}')"
      - name: Install the supported MagicPIG native sanitizer compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
          g++-14 --version


      - name: CPU and commit information
        run: |
          uname -a
          lscpu || true
          grep -m1 '^flags' /proc/cpuinfo || true
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD

      - name: Validate ledger and materialize artifact
        run: |
          python3 tools/validate_traceability.py --emit-dir traceability-artifact
          if find papers -type f -name '*.pdf' -print -quit | grep -q .; then
            find papers -type f -name '*.pdf' -print0 | sort -z | xargs -0 sha256sum
          else
            echo "No local paper PDFs are present in this commit."
          fi

      - name: Audit verified C++, CUDA and Cython documentation
        run: |
          python3 tools/audit_traceability_docs.py

      - name: MagicPIG scoped source identity and inventory contracts
        run: |
          python3 tests/traceability/test_magicpig_source_contracts.py
          python3 tools/check_magicpig_sources.py --emit-dir traceability-artifact/magicpig-source

      - name: Scatterbrain selected initial source and separate reference identities
        run: |
          python3 tests/traceability/test_scatterbrain_source_contracts.py
          python3 tools/check_scatterbrain_sources.py --emit-dir traceability-artifact/scatterbrain-source
          python3 tests/traceability/test_scatterbrain_sbsmyrf_source_contracts.py
          python3 tools/check_scatterbrain_sbsmyrf_sources.py --emit-dir traceability-artifact/scatterbrain-sbsmyrf-source

      - name: MagicPIG portable CPU oracles and capability-gated native bodies
        run: |
          python3 tests/traceability/test_magicpig_capabilities.py
          python3 tests/traceability/test_magicpig_cpu_contracts.py
          python3 tests/traceability/test_magicpig_boundary_contracts.py
          python3 tests/traceability/test_magicpig_ci_reporting.py
          python3 tests/traceability/test_python_typing_inventory.py
          python3 tools/generate_magicpig_probability_reference.py --check
          mkdir -p traceability-artifact/magicpig-cpu/plain traceability-artifact/magicpig-cpu/sanitized
          set -o pipefail
          python3 tools/check_magicpig_cpu.py --cxx g++-14 --native --build-dir traceability-artifact/magicpig-cpu/plain 2>&1 | tee traceability-artifact/magicpig-cpu/plain/run.log
          python3 tools/check_magicpig_cpu.py --cxx g++-14 --native --sanitize --build-dir traceability-artifact/magicpig-cpu/sanitized 2>&1 | tee traceability-artifact/magicpig-cpu/sanitized/run.log

      - name: Report actual native execution separately from skips
        if: always()
        run: |
          python3 tools/report_magicpig_cpu.py \
            --evidence traceability-artifact/magicpig-cpu/plain/magicpig_cpu_evidence.json \
            --evidence traceability-artifact/magicpig-cpu/sanitized/magicpig_cpu_evidence.json

      - name: Bounded OpenMP attention ownership regression
        env:
          OMP_THREAD_LIMIT: "4"
          OMP_NUM_THREADS: "4"
        run: |
          g++-14 -std=c++17 -O1 -fno-tree-vectorize -fno-tree-slp-vectorize -fopenmp -fsanitize=address,undefined -g -fno-sanitize-recover=all -fno-omit-frame-pointer -no-pie traceability-artifact/magicpig-cpu/sanitized/portable/attention/selected_bodies.cpp -o traceability-artifact/magicpig-cpu/attention-openmp
          traceability-artifact/magicpig-cpu/attention-openmp
          echo "::notice title=MagicPIG bounded OpenMP attention::PASS; OMP_THREAD_LIMIT=4; OMP_NUM_THREADS=4; ASan+UBSan+LSan; commit=$(git rev-parse HEAD)"

      - name: G-SLIDE CPU serial CUDA-body oracles and sanitizers
        run: |
          python3 tests/traceability/test_gslide_suite_contracts.py
          python3 tools/check_gslide_cpu.py --build-dir traceability-artifact/gslide-cpu/plain
          python3 tools/check_gslide_cpu.py --sanitize --build-dir traceability-artifact/gslide-cpu/sanitized

      - name: Original SLIDE LSH packing characterization
        run: |
          g++ -std=c++11 -O0             tests/traceability/test_slide_lsh_packing.cpp             ports/slide-original/SLIDE/LSH.cpp             ports/slide-original/SLIDE/Bucket.cpp             -Iports/slide-original/SLIDE             -o /tmp/test_slide_lsh_packing
          /tmp/test_slide_lsh_packing
          g++ -std=c++11 -O0 tests/traceability/test_slide_lsh_table.cpp ports/slide-original/SLIDE/LSH.cpp ports/slide-original/SLIDE/Bucket.cpp -Iports/slide-original/SLIDE -o /tmp/test_slide_lsh_table
          /tmp/test_slide_lsh_table
          g++ -std=c++11 -O0 tests/traceability/test_slide_bucket_fifo.cpp ports/slide-original/SLIDE/Bucket.cpp -Iports/slide-original/SLIDE -o /tmp/test_slide_bucket_fifo
          /tmp/test_slide_bucket_fifo
          g++ -std=c++11 -O0 tests/traceability/test_slide_sampling_policy.cpp ports/slide-original/SLIDE/SamplingPolicy.cpp -Iports/slide-original/SLIDE -o /tmp/test_slide_sampling_policy
          /tmp/test_slide_sampling_policy
          g++ -std=c++11 -O0 tests/traceability/test_slide_sparse_node_math.cpp ports/slide-original/SLIDE/Node.cpp -Iports/slide-original/SLIDE -o /tmp/test_slide_sparse_node_math
          /tmp/test_slide_sparse_node_math
          g++ -std=c++11 -O0 tests/traceability/test_optimized_weight_layout.cpp -o /tmp/test_optimized_weight_layout
          /tmp/test_optimized_weight_layout

      - name: WTA and DWTA prerequisite oracles
        run: |
          g++ -std=c++11 -O0 tests/traceability/test_wta_dwta_primitives.cpp \
            ports/slide-original/SLIDE/WtaHash.cpp \
            ports/slide-original/SLIDE/DensifiedWtaHash.cpp \
            -Iports/slide-original/SLIDE -o /tmp/test_wta_dwta_primitives
          /tmp/test_wta_dwta_primitives

      - name: Original SLIDE Softmax oracle
        run: |
          g++ -std=c++11 -O0 tests/traceability/test_slide_softmax_math.cpp \
            ports/slide-original/SLIDE/Node.cpp -Iports/slide-original/SLIDE \
            -o /tmp/test_slide_softmax_math
          /tmp/test_slide_softmax_math

      - name: Original SLIDE two-layer backward oracle
        run: |
          g++ -std=c++11 -O0 tests/traceability/test_slide_two_layer_backward.cpp \
            ports/slide-original/SLIDE/Node.cpp -Iports/slide-original/SLIDE \
            -o /tmp/test_slide_two_layer_backward
          /tmp/test_slide_two_layer_backward

      - name: Original SLIDE Adam state oracle
        run: |
          g++ -std=c++11 -O0 tests/traceability/test_slide_adam_state.cpp \
            -Iports/slide-original/SLIDE -o /tmp/test_slide_adam_state
          /tmp/test_slide_adam_state

      - name: Original SLIDE maintenance schedule oracle
        run: |
          g++ -std=c++11 -O0 tests/traceability/test_slide_maintenance_schedule.cpp \
            -Iports/slide-original/SLIDE -o /tmp/test_slide_maintenance_schedule
          /tmp/test_slide_maintenance_schedule

      - name: Optimized SLIDE BF16 conversion characterization
        run: |
          g++ -std=c++17 -O0 -mavx512f             tests/traceability/test_bfloat16_conversion.cpp             -Iports/slide-optimized-avx512/SLIDE             -o /tmp/test_bfloat16_conversion
          /tmp/test_bfloat16_conversion

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-code-traceability
          path: traceability-artifact/

  scatterbrain-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPYCACHEPREFIX: /tmp/scatterbrain-bytecode
      OMP_THREAD_LIMIT: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Record the exact tested checkout
        run: |
          echo "::notice title=Tested merge candidate::commit=$(git rev-parse HEAD);tree=$(git rev-parse 'HEAD^{tree}')"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the supported Scatterbrain CPU compiler and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
          g++-14 --version
          python -m pip install -r tools/scatterbrain-cpu-requirements.txt
          python -m pip install ninja==1.13.0
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip check

      - name: Actual MagicPIG Torch FBGEMM CPU boundary
        env:
          OMP_THREAD_LIMIT: "4"
        run: |
          python tools/check_magicpig_extension_cpu.py --cxx g++-14 \
            --build-dir scatterbrain-cpu-artifact/magicpig-extension

      - name: Complete MagicPIG CPU server orchestration and tiny helpers
        env:
          OMP_THREAD_LIMIT: "4"
        run: |
          python tools/check_magicpig_server_cpu.py --cxx g++-14 \
            --build-dir scatterbrain-cpu-artifact/magicpig-extension

      - name: Verify initial and native dependency source identities
        run: |
          python tools/check_scatterbrain_sources.py
          python tools/check_scatterbrain_initial_cpu.py --verify-dependency-only
          python tools/check_scatterbrain_initial_cpu.py --test-dependency-contracts

      - name: Maintained positive features, projections and lifecycle regressions
        run: |
          python tests/traceability/test_scatterbrain_feature_cpu.py \
            --emit-dir scatterbrain-cpu-artifact/features
          python tests/traceability/test_scatterbrain_feature_state.py \
            --port-root ports/scatterbrain \
            --evidence scatterbrain-cpu-artifact/features/lifecycle.json

      - name: Actual maintained SBLocal with original native CPU kernels
        run: |
          python tools/check_scatterbrain_initial_cpu.py \
            --cxx g++-14 --build-dir scatterbrain-cpu-artifact/initial

      - name: Separately pinned later SBSmyrf reference characterization
        run: |
          python tools/check_scatterbrain_later_cpu.py \
            --emit-dir scatterbrain-cpu-artifact/later

      - name: Maintained later SBSmyrf dtypes, raw composition and returned weights
        run: |
          python tools/check_scatterbrain_sbsmyrf_sources.py
          python tools/check_scatterbrain_sbsmyrf_cpu.py \
            --emit-dir scatterbrain-cpu-artifact/maintained-later

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scatterbrain-cpu-evidence
          path: scatterbrain-cpu-artifact/

  sycl-cpu:
    runs-on: ubuntu-24.04
    # LLVM and runtime artifacts below target Debian13/glibc, independently of
    # the hosted runner distribution. This image digest is immutable.
    container: debian:13-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
    timeout-minutes: 25
    env:
      ACPP_TOOLCHAIN_ROOT: /workspace/.sycl-toolchain
      SYCL_BUILD_JOBS: "2"
      OMP_NUM_THREADS: "4"
      OMP_THREAD_LIMIT: "4"
    steps:
      - name: Install signed distribution prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 python3-venv g++ libc6-dev libedit2 libffi8 libxml2 libz3-4 libpfm4 libtinfo6 zlib1g libzstd1 time util-linux xz-utils
      - uses: actions/checkout@v4
      - name: Restore pinned CPU compiler and runtime
        uses: actions/cache@v4
        with:
          path: |
            /workspace/.sycl-toolchain/install
            /workspace/.sycl-toolchain/debian-root
            /workspace/.sycl-toolchain/python-tools
            /workspace/.sycl-toolchain/env.sh
          key: sycl-debian13-amd64-llvm19-${{ hashFiles('tools/bootstrap_sycl_cpu.sh', 'tools/sycl-cpu-packages.tsv') }}
      - name: Install or verify pinned real CPU backend
        shell: bash
        run: tools/bootstrap_sycl_cpu.sh
      - name: Execute required CPU device contracts with independent oracle
        shell: bash
        run: |
          source /workspace/.sycl-toolchain/env.sh
          tools/check_sycl_cpu.sh --build-dir sycl-cpu-evidence/backend
      - name: Install pinned paper acceptance CPU Python dependencies
        shell: bash
        run: |
          python3 -m venv /workspace/.sycl-cpu-venv
          /workspace/.sycl-cpu-venv/bin/python -m pip install numpy==2.3.5 einops==0.8.1 tqdm==4.67.1
          /workspace/.sycl-cpu-venv/bin/python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          /workspace/.sycl-cpu-venv/bin/python -m pip check
      - name: Execute all required paper CPU acceptance and source regressions
        shell: bash
        run: |
          source /workspace/.sycl-toolchain/env.sh
          tools/run_sycl_paper_cpu.sh --python /workspace/.sycl-cpu-venv/bin/python --build-dir sycl-cpu-evidence/papers
      - name: Upload source, binary, device and resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sycl-cpu-${{ github.sha }}
          path: |
            sycl-cpu-evidence
            /workspace/.sycl-toolchain/setup
          retention-days: 14
