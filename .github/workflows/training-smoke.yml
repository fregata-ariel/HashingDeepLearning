name: Training smoke tests

on:
  push:
    branches:
      - research/lsh-lineage-vendor
  workflow_dispatch:

jobs:
  original-slide-one-step:
    if: github.event_name == 'workflow_dispatch'
    name: Original SLIDE / one training batch
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Original SLIDE
        working-directory: third_party/slide-original
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Generate tiny SVM datasets and config
        working-directory: third_party/slide-original
        run: |
          python - <<'PY'
          from pathlib import Path

          def row(label, shift=0):
              ids = [(shift+i) % 32 for i in range(4)]
              vals = [1.0, 0.5, 0.25, 0.125]
              return str(label) + " " + " ".join(f"{i}:{v}" for i, v in zip(ids, vals))

          train = ["2 32 4", row(0,0), row(1,4)]
          test = ["40 32 4"]
          for i in range(40):
              test.append(row(i % 4, (i*3) % 32))

          Path("smoke_train.txt").write_text("\n".join(train) + "\n")
          Path("smoke_test.txt").write_text("\n".join(test) + "\n")
          Path("smoke.cfg").write_text("""RangePow=6
          K=2
          L=2
          Sparsity=1,1
          Batchsize=2
          Rehash=1000
          Rebuild=1000
          InputDim=32
          totRecords=2
          totRecordsTest=40
          Lr=0.001
          Epoch=1
          Stepsize=1000
          sizesOfLayers=4
          numLayer=1
          trainData=smoke_train.txt
          testData=smoke_test.txt
          weight=unused.npz
          savedweight=smoke_weights.npz
          logFile=smoke_log.txt
          """.replace("          ",""))
          PY
      - name: Run one training batch through normal shutdown
        working-directory: third_party/slide-original
        env:
          OMP_NUM_THREADS: "2"
        run: |
          set -o pipefail
          timeout 90s ./build/runme smoke.cfg 2>&1 | tee smoke_run.log
          test -s smoke_weights.npz
          test -s smoke_log.txt
          grep -q "Network Initialization takes" smoke_run.log
          grep -q "over all" smoke_run.log
          echo "TRAINING_SMOKE_COMPLETED"

  mongoose-triplet-one-step:
    if: github.event_name == 'workflow_dispatch'
    name: MONGOOSE / learnable-hash optimizer step
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && python -m pip install torch
      - name: Execute one learnable-hash training step
        working-directory: third_party/mongoose
        run: |
          python - <<'PY'
          import torch
          from mongoose_slide.slide_lib.triplet_network import TripletNet

          torch.manual_seed(7)
          model = TripletNet(margin=0.2, K=2, L=2, layer_size=8)
          opt = torch.optim.SGD(model.parameters(), lr=0.05)

          arc = torch.randn(6, 8)
          pair = torch.randn(6, 8)
          label = torch.tensor([1., 0., 1., 0., 1., 0.])

          before = model.dense1.weight.detach().clone()
          loss = model(arc, pair, label)
          assert torch.isfinite(loss), loss
          opt.zero_grad()
          loss.backward()
          assert model.dense1.weight.grad is not None
          assert torch.isfinite(model.dense1.weight.grad).all()
          opt.step()
          after = model.dense1.weight.detach()
          assert not torch.equal(before, after)
          print("loss", float(loss))
          print("weight_delta_l1", float((after-before).abs().sum()))
          print("MONGOOSE_TRIPLET_TRAINING_STEP_COMPLETED")
          PY

  intel-oneapi-current:
    if: github.event_name == 'workflow_dispatch'
    name: Intel oneAPI current / compiler inventory
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: intel/oneapi:2026.1.0-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Show compiler inventory
        shell: bash
        run: |
          set -euxo pipefail
          source /opt/intel/oneapi/setvars.sh || true
          command -v icx
          command -v icpx
          icx --version
          icpx --version
          command -v icc || true
          command -v icpc || true

  intel-oneapi-classic-era:
    if: github.event_name == 'workflow_dispatch'
    name: Intel oneAPI 2023.2 / classic compiler inventory
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: intel/oneapi-hpckit:2023.2-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Show compiler inventory
        shell: bash
        run: |
          set -euxo pipefail
          source /opt/intel/oneapi/setvars.sh || true
          command -v icx || true
          command -v icpx || true
          command -v icc
          command -v icpc
          icpc --version


  optimized-slide-intel-classic-one-step:
    if: github.event_name == 'workflow_dispatch'
    name: Optimized SLIDE / Intel Classic / one training batch
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: intel/oneapi-hpckit:2023.2-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare historical source for executable smoke probe
        working-directory: third_party/slide-optimized-avx512
        shell: bash
        run: |
          set -euxo pipefail
          source /opt/intel/oneapi/setvars.sh || true
          command -v icpc
          icpc --version
          python3 - <<'PY'
          from pathlib import Path

          p = Path("SLIDE/DataLayerOpt.h")
          s = p.read_text()
          bad = "DataLayerOpt() numRecords_{0}, numFeatures_ {0}, numLabels_ {0} {};"
          good = "DataLayerOpt() : numRecords_(0), numFeatures_(0), numLabels_(0) {}"
          assert bad in s
          p.write_text(s.replace(bad, good))

          p = Path("SLIDE/main.cpp")
          lines = p.read_text().splitlines(keepends=True)
          out = []
          i = 0
          removed = False
          while i < len(lines):
              if "if (numLayer >= MAX_BUFFER_SIZE)" in lines[i]:
                  assert i + 2 < len(lines)
                  assert "numLayer = MAX_BUFFER_SIZE;" in lines[i + 1]
                  assert "}" in lines[i + 2]
                  i += 3
                  removed = True
                  continue
              if "delete sizesOfLayers;" in lines[i]:
                  i += 1
                  continue
              out.append(lines[i])
              i += 1
          assert removed, "MAX_BUFFER_SIZE regression block not found"
          p.write_text("".join(out))

          p = Path("SLIDE/srp.cpp")
          s = p.read_text()
          if "#include <cstring>" not in s:
              s = "#include <cstring>\n" + s
          p.write_text(s)

          p = Path("SLIDE/DataLayerOpt.cpp")
          s = p.read_text()
          for name in ("offsets_", "lengths_", "labelOffsets_", "labelLengths_"):
              s = s.replace(f"{name}.reserve(numRecords_);", f"{name}.resize(numRecords_);")
          p.write_text(s)
          PY
      - name: Configure and build with icpc
        working-directory: third_party/slide-optimized-avx512
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh || true
          cmake -S . -B build-intel             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_C_COMPILER=icc             -DCMAKE_CXX_COMPILER=icpc             -DOPT_IA=ON             -DOPT_AVX512=OFF             -DOPT_AVX512_BF16=OFF
          cmake --build build-intel --parallel 2
      - name: Generate tiny SVM datasets and config
        working-directory: third_party/slide-optimized-avx512
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def row(label, shift=0):
              ids = [(shift+i) % 32 for i in range(4)]
              vals = [1.0, 0.5, 0.25, 0.125]
              return str(label) + " " + " ".join(f"{i}:{v}" for i, v in zip(ids, vals))

          train = ["2 32 4", row(0,0), row(1,4)]
          test = ["40 32 4"]
          for i in range(40):
              test.append(row(i % 4, (i*3) % 32))

          Path("smoke_train.txt").write_text("\n".join(train) + "\n")
          Path("smoke_test.txt").write_text("\n".join(test) + "\n")
          Path("smoke.cfg").write_text("""RangePow=6
          K=2
          L=2
          Sparsity=1,1
          Batchsize=2
          Rehash=1000
          Rebuild=1000
          InputDim=32
          totRecords=2
          totRecordsTest=40
          Lr=0.001
          Epoch=1
          Stepsize=1000
          sizesOfLayers=4
          numLayer=1
          trainData=smoke_train.txt
          testData=smoke_test.txt
          weight=unused.npz
          savedweight=smoke_weights.npz
          logFile=smoke_log.txt
          Bfloat16Opt=0
          """.replace("          ",""))
          PY
      - name: Run one optimized training batch through destructor and exit
        working-directory: third_party/slide-optimized-avx512
        shell: bash
        env:
          OMP_NUM_THREADS: "2"
        run: |
          set -euxo pipefail
          source /opt/intel/oneapi/setvars.sh || true
          timeout 90s ./build-intel/runme smoke.cfg 2>&1 | tee smoke_run.log
          test -s smoke_weights.npz
          test -s smoke_log.txt
          grep -q "Network Initialization takes" smoke_run.log
          grep -q "Data loading takes" smoke_run.log
          grep -q "over all" smoke_run.log
          echo "OPTIMIZED_SLIDE_INTEL_TRAINING_SMOKE_COMPLETED"


  optimized-slide-gcc-one-step:
    name: Optimized SLIDE / generic GCC / one training batch
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply CI-only compatibility fixes
        working-directory: third_party/slide-optimized-avx512
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("SLIDE/DataLayerOpt.h")
          s = p.read_text()
          bad = "DataLayerOpt() numRecords_{0}, numFeatures_ {0}, numLabels_ {0} {};"
          good = "DataLayerOpt() : numRecords_(0), numFeatures_(0), numLabels_(0) {}"
          assert bad in s
          p.write_text(s.replace(bad, good))

          p = Path("SLIDE/main.cpp")
          lines = p.read_text().splitlines(keepends=True)
          out = []
          i = 0
          removed = False
          while i < len(lines):
              if "if (numLayer >= MAX_BUFFER_SIZE)" in lines[i]:
                  assert "numLayer = MAX_BUFFER_SIZE;" in lines[i + 1]
                  i += 3
                  removed = True
                  continue
              if "delete sizesOfLayers;" in lines[i]:
                  i += 1
                  continue
              out.append(lines[i])
              i += 1
          assert removed
          p.write_text("".join(out))

          p = Path("SLIDE/srp.cpp")
          s = p.read_text()
          if "#include <cstring>" not in s:
              p.write_text("#include <cstring>\n" + s)

          p = Path("SLIDE/DataLayerOpt.cpp")
          s = p.read_text()
          for name in ("offsets_", "lengths_", "labelOffsets_", "labelLengths_"):
              old = f"{name}.reserve(numRecords_);"
              assert old in s
              s = s.replace(old, f"{name}.resize(numRecords_);")
          p.write_text(s)
          PY
      - name: Configure and build
        working-directory: third_party/slide-optimized-avx512
        run: |
          cmake -S . -B build-train             -DCMAKE_BUILD_TYPE=Release             -DOPT_IA=ON             -DOPT_AVX512=OFF             -DOPT_AVX512_BF16=OFF
          cmake --build build-train --parallel 2
      - name: Generate tiny SVM datasets and config
        working-directory: third_party/slide-optimized-avx512
        run: |
          python - <<'PY'
          from pathlib import Path
          def row(label, shift=0):
              ids = [(shift+i) % 32 for i in range(4)]
              vals = [1.0, 0.5, 0.25, 0.125]
              return str(label) + " " + " ".join(f"{i}:{v}" for i, v in zip(ids, vals))
          train = ["2 32 4", row(0,0), row(1,4)]
          test = ["40 32 4"] + [row(i % 4, (i*3) % 32) for i in range(40)]
          Path("smoke_train.txt").write_text("\n".join(train) + "\n")
          Path("smoke_test.txt").write_text("\n".join(test) + "\n")
          Path("smoke.cfg").write_text("""RangePow=6
          K=2
          L=2
          Sparsity=1,1
          Batchsize=2
          Rehash=1000
          Rebuild=1000
          InputDim=32
          totRecords=2
          totRecordsTest=40
          Lr=0.001
          Epoch=1
          Stepsize=1000
          sizesOfLayers=4
          numLayer=1
          trainData=smoke_train.txt
          testData=smoke_test.txt
          weight=unused.npz
          savedweight=smoke_weights.npz
          logFile=smoke_log.txt
          Bfloat16Opt=0
          """.replace("          ",""))
          PY
      - name: Run one optimized training batch through destructor and exit
        working-directory: third_party/slide-optimized-avx512
        env:
          OMP_NUM_THREADS: "2"
        run: |
          set -o pipefail
          timeout 90s ./build-train/runme smoke.cfg 2>&1 | tee smoke_run.log
          test -s smoke_weights.npz
          test -s smoke_log.txt
          grep -q "Network Initialization takes" smoke_run.log
          grep -q "Data loading takes" smoke_run.log
          grep -q "over all" smoke_run.log
          echo "OPTIMIZED_SLIDE_GCC_TRAINING_SMOKE_COMPLETED"
